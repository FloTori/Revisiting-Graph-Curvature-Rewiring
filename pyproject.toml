[project]
name = "revisiting-curvature-rewiring"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.7.0+cu126",
    "torch-geometric==2.7.0",
    "pyg-lib",
    "numpy==2.2.5",
    "scipy==1.15.2",
    "scikit-learn==1.6.1",
    "numba==0.61.2",
    "matplotlib==3.10.0",
    "seaborn==0.13.2",
    "pillow==11.0.0",
    "networkx==3.3",
    "ogb==1.3.6",
    "hyperopt==0.2.7",
    "wandb==0.19.10",
    "aiohttp==3.11.18",
    "requests==2.32.3",
    "ipykernel",
    "ipywidgets==8.1.8",
    "tqdm==4.67.1",
    "pyyaml==6.0.2",
    "python-dotenv==1.2.1",
    "pydantic==2.11.4",
    "joblib==1.5.0",
    "jinja2==3.1.4",
    "click==8.1.8",
    "cuda-python>=12.6,<12.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["experiment_utils", "models", "utils"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv]
find-links = ["https://data.pyg.org/whl/torch-2.7.0+cu126.html"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
